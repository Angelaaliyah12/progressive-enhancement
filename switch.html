<!doctype html>
<html lang="nl">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width">
		<title>Switch control / Progressive Enhancement / FDND</title>
		<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
		<link href="assets/styles.css" rel="stylesheet">
		<style>
			/* bron: https://www.youtube.com/watch?v=LXgEpkYpnL0 */
body{
	display:flex;
	justify-content: center;
	align-items: center;
	height: 100vh;
	background: rgb(108, 210, 244);
}

.toggle{
	width: 60px;
	height: 30px;
	background-color: rgb(226, 250, 117);
	border-radius: 30px;
	position: relative;
	cursor: pointer;
	border:solid 1px rgb(37, 219, 37);
}
.toggle::before{
	content:"";
	position: absolute;
	top: 2px;
	left: 2px;
	width: 26px;
	height: 26px;
	background: rgb(153, 119, 234);
	border-radius: 50%;
	transition: 3s;
}

input:checked + .toggle::before {
    background: red;
}

input{
	display:none;
}
input:checked + .toggle{
	background: rgb(248, 196, 237);
}
input:checked + .toggle::before{
	left: 32px;
	box-shadow: 0 2px 4px rgba(210, 16, 16, 0.621);

}
		</style>
	</head>
	<body>
		<h1>Switch control</h1>
	
		<input type="checkbox" id="switch">
		<label for="switch" class="toggle"></label>
	</body>
</html>
